[package]
name = "yaku-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "Yaku CLI - Yakumo API 命令行工具"

[[bin]]
name = "yaku"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.15"
dirs = "6"
env_logger = "0.11"
hex = { workspace = true }
log = { workspace = true }
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "io-util",
  "net",
  "signal",
  "time",
] }
yaku-domain = { workspace = true }
yaku-engine = { workspace = true }
yaku-store = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
futures-util = "0.3.31"
prost = "0.14.3"
predicates = "3"
tempfile = "3"
tokio-stream = { version = "0.1.14", features = ["net"] }
tokio-tungstenite = { version = "0.26.2", default-features = false }
tonic = { version = "0.14.5", default-features = false, features = ["transport", "server", "router"] }
tonic-prost = "0.14.5"
tonic-reflection = "0.14.5"
