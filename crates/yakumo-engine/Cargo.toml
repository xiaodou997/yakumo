[package]
name = "yakumo-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { workspace = true, features = ["serde"] }
futures-util = "0.3.31"
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = [
  "rustls-tls-native-roots",
  "connect",
] }
yakumo-domain = { workspace = true }
yakumo-grpc = { workspace = true }

[dev-dependencies]
prost = "0.14.3"
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1.14", features = ["net"] }
tonic = { version = "0.14.5", default-features = false, features = ["transport", "server", "router"] }
tonic-prost = "0.14.5"
tonic-reflection = "0.14.5"
yakumo-store = { workspace = true }
